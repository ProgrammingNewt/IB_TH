[project]
name = "lab-drive-harness"
version = "0.1.0"
description = "A collaborative, science-focused agent harness over a shared lab drive"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "openpyxl>=3.1",
    "reportlab>=4.1",
    "pypdf>=4.2",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "ipykernel>=6.29",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "openai>=1.40",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "streamlit>=1.36",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harness*", "datagen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
